[project]
name = "homestock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "pymysql>=1.1",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/deps.py" = ["B008"]
"app/api/resolve.py" = ["B008"]
"app/api/products.py" = ["B008"]
"app/api/inventory.py" = ["B008"]
"app/api/shopping_list.py" = ["B008"]
"app/api/movements.py" = ["B008"]
"app/api/scan.py" = ["B008"]
"app/api/review.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
