<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Alimenda - Detalle de Producto</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind Configuration -->

    theme: {

        "colors": {
                "on-primary": "#003915",
                "surface": "#0e150e",

                "surface-container-low": "#161d16",
                "surface-bright": "#333b33",
                "outline": "#869585",
                "surface-container-highest": "#2f372e",
                "on-tertiary-fixed": "#410001",
                "background": "#0e150e",
                "surface-dim": "#0e150e",
                "on-error-container": "#ffdad6",
                "primary": "#4be277",
                "tertiary-fixed": "#ffdad5",
                "on-secondary-fixed-variant": "#3a485c",
                "tertiary": "#ffb5ab",
                "primary-container": "#22c55e",
                "primary-fixed": "#6bff8f",
                "on-tertiary-fixed-variant": "#7f2a21",
                "on-primary-container": "#004b1e",
                "inverse-primary": "#006e2f",
                "on-secondary-container": "#abb9d2",
                "on-secondary": "#233144",
                "on-secondary-fixed": "#0d1c2f",
                "tertiary-container": "#ff8b7c",
                "secondary-fixed-dim": "#b9c7e0",
                "secondary": "#b9c7e0",
                "on-tertiary": "#60130d",
                "on-surface": "#dce5d9",
                "inverse-surface": "#dce5d9",
                "surface-container-lowest": "#091009",
                "on-error": "#690005",
                "on-tertiary-container": "#76231b",
                "secondary-container": "#3c4a5e",
                "on-primary-fixed": "#002109",
                "surface-container-high": "#242c24",
                "surface-tint": "#4ae176",
                "error-container": "#93000a",
                "on-background": "#dce5d9",
                "primary-fixed-dim": "#4ae176",
                "secondary-fixed": "#d5e3fd",
                "tertiary-fixed-dim": "#ffb4a9",

        },
        "borderRadius": {
                "DEFAULT": "0.25rem",

                "xl": "0.75rem",

        },
        "spacing": {
                "gutter": "16px",
                "md": "16px",
                "lg": "24px",
                "margin-desktop": "32px",
                "margin-mobile": "16px",
                "xs": "4px",
                "xl": "40px",
                "sm": "12px",
                "base": "8px"
        },
        "fontFamily": {
                "headline-lg-mobile": ["Inter"],
                "title-md": ["Inter"],
                "body-lg": ["Inter"],

                "display-lg": ["Inter"],
                "label-sm": ["Inter"]
        },
        "fontSize": {
                "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
        }
      },
    },
  }
</script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0e150e;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .soft-card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.4);
        }
        .active-interaction:active {
            transform: scale(0.98);
            transition: transform 0.15s ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2f372e;
            border-radius: 10px;
        }
        input:focus {
            outline: none;
            border-color: #4be277 !important;
        }
        /* Custom date picker icon color for dark mode */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background bg-background">
<!-- Top Navigation -->
<header class="w-full top-0 sticky z-40 flex justify-between items-center px-gutter h-16 bg-background/80 backdrop-blur-md border-b border-outline-variant/10">
<button class="p-2 active-interaction" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<span class="text-title-md font-title-md text-primary tracking-tight">Escaneado</span>
<button class="p-2 active-interaction">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</header>
<main class="max-w-md mx-auto pb-40">
<!-- Product Image Section -->
<div class="relative w-full aspect-square overflow-hidden bg-surface-container-low px-gutter pt-4">
<div class="w-full h-full rounded-2xl overflow-hidden soft-card-shadow border border-outline-variant/20">
<img alt="Organic Oatmeal Product" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMvcg4q5LpH3Q62jloVHu8s-bukc-OAcVoH5AgJ_dHu55N1pwFAjTkjhEqZmIKxo9IJDEdFRVEyZk1K_aARGbnXaArdTpS-sbYy0XaPArYnTszbliQBwhcyy4V8ug-rf0BVaXJ4oXRAIKWenbZ2eP_SVYZ2n_9MOPVMz3xwofDCQAOUayHmfmnR7NIUVVMZ4W7lOqZ7npvoFqvWrEvgAcAw4602OrOcql2D5D8Dif7XiNslwGd7kVI429N_SQK2Z2Mac-XDOGNwQM"/>
</div>
<!-- Success Badge -->
<div class="absolute top-8 right-10 bg-primary-container text-on-primary-container px-4 py-1.5 rounded-full flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-sm font-label-sm font-bold">Reconocido</span>
</div>
</div>
<!-- Product Content -->
<section class="px-gutter mt-lg">
<div class="flex flex-col gap-1">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-widest font-bold">Cereales y Granos</span>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Cereal de Avena Organico</h1>
<p class="text-body-md font-body-md text-on-surface-variant">350g • Fuente natural de fibra</p>
</div>
<!-- Configuration Grid -->
<div class="mt-lg flex flex-col gap-md">
<!-- Quantity & Location Row -->
<div class="grid grid-cols-2 gap-md">
<!-- Quantity Selector -->
<div class="bg-surface-container-low p-4 rounded-xl soft-card-shadow border border-outline-variant/30">
<label class="text-label-sm font-label-sm text-on-surface-variant block mb-3 font-bold">Cantidad</label>
<div class="flex items-center justify-between">
<button class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center active-interaction border border-outline-variant/20" onclick="updateQty(-1)">
<span class="material-symbols-outlined text-on-surface">remove</span>
</button>
<span class="text-title-md font-title-md text-on-surface" id="qty-value">1</span>
<button class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center active-interaction border border-outline-variant/20" onclick="updateQty(1)">
<span class="material-symbols-outlined text-on-surface">add</span>
</button>
</div>
</div>
<!-- Category Picker -->
<div class="bg-surface-container-low p-4 rounded-xl soft-card-shadow border border-outline-variant/30">
<label class="text-label-sm font-label-sm text-on-surface-variant block mb-3 font-bold">Ubicación</label>
<div class="flex items-center justify-between text-on-surface active-interaction cursor-pointer" onclick="document.getElementById('category-select').click()">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">kitchen</span>
<span class="text-body-lg font-body-lg" id="location-text">Despensa</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">expand_more</span>
<select class="hidden" id="category-select" onchange="document.getElementById('location-text').innerText = this.value">
<option value="Despensa">Despensa</option>
<option value="Nevera">Nevera</option>
<option value="Congelador">Congelador</option>
</select>
</div>
</div>
</div>
<!-- Expiration Date Field -->
<div class="bg-surface-container-low p-4 rounded-xl soft-card-shadow border border-outline-variant/30">
<label class="text-label-sm font-label-sm text-on-surface-variant block mb-2 font-bold">Fecha de Vencimiento</label>
<div class="flex items-center gap-3 bg-surface-container-high p-3 rounded-lg border border-outline-variant/40">
<span class="material-symbols-outlined text-tertiary">calendar_today</span>
<input class="bg-transparent border-none w-full text-body-lg font-body-lg text-on-surface focus:ring-0 p-0" type="date" value="2024-12-31"/>
</div>
<div class="mt-2 flex items-center gap-2 px-1">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<span class="text-body-md font-body-md text-on-surface-variant">Larga duración detectada</span>
</div>
</div>
<!-- Section Selector -->
<div class="mt-2">
<label class="text-label-sm font-label-sm text-on-surface-variant block mb-3 font-bold">Categoría de Inventario</label>
<div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
<button class="px-6 py-2 rounded-full bg-primary-container text-on-primary-container text-label-sm font-bold border border-primary/20 whitespace-nowrap active-interaction">Pantry</button>
<button class="px-6 py-2 rounded-full bg-surface-container-highest text-on-surface-variant text-label-sm font-bold whitespace-nowrap active-interaction border border-outline-variant/20">Fridge</button>
<button class="px-6 py-2 rounded-full bg-surface-container-highest text-on-surface-variant text-label-sm font-bold whitespace-nowrap active-interaction border border-outline-variant/20">Freezer</button>
<button class="px-6 py-2 rounded-full bg-surface-container-highest text-on-surface-variant text-label-sm font-bold whitespace-nowrap active-interaction border border-outline-variant/20">Counter</button>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Action Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-low p-gutter flex flex-col gap-3 border-t border-outline-variant/20 shadow-2xl z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-full flex items-center justify-center gap-2 font-bold active-interaction shadow-lg" id="add-btn">
<span class="material-symbols-outlined">add_shopping_cart</span>
            Añadir a mi despensa
        </button>
<button class="w-full h-14 bg-surface-container-highest text-on-surface rounded-full flex items-center justify-center gap-2 font-bold active-interaction border border-outline-variant/30">
<span class="material-symbols-outlined">edit</span>
            Editar información
        </button>
<div class="h-4"></div>
</footer>
<script>
        // Quantity Logic
        let currentQty = 1;
        function updateQty(delta) {
            currentQty = Math.max(1, currentQty + delta);
            document.getElementById('qty-value').innerText = currentQty;
        }

        // Simple Tab Interaction
        const categoryButtons = document.querySelectorAll('.overflow-x-auto button');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
                });
                btn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
            });
        });

        // Add to Pantry Success Micro-interaction
        document.getElementById('add-btn').addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-bounce">check</span> ¡Guardado!';
            this.classList.remove('bg-primary', 'text-on-primary');
            this.classList.add('bg-primary-container', 'text-on-primary-container');
            
            setTimeout(() => {
                this.innerHTML = originalContent;
                this.classList.add('bg-primary', 'text-on-primary');
                this.classList.remove('bg-primary-container', 'text-on-primary-container');
            }, 2000);
        });
    </script>
</body></html>
