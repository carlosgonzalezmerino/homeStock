<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Alimenda - Detalle de Producto</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind Configuration -->

        darkMode: "class",
        theme: {
          extend: {

                    "on-primary": "#ffffff",
                    "surface": "#f7f9fb",
                    "on-primary-fixed-variant": "#005321",
                    "surface-container": "#eceef0",

                    "surface-variant": "#e0e3e5",
                    "outline-variant": "#bccbb9",
                    "surface-container-low": "#f2f4f6",
                    "surface-bright": "#f7f9fb",
                    "outline": "#6d7b6c",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary-fixed": "#341100",
                    "background": "#f7f9fb",
                    "surface-dim": "#d8dadc",
                    "on-error-container": "#93000a",
                    "primary": "#006e2f",
                    "tertiary-fixed": "#ffdbca",
                    "on-secondary-fixed-variant": "#3c475a",
                    "tertiary": "#9d4300",
                    "primary-container": "#22c55e",
                    "primary-fixed": "#6bff8f",
                    "on-tertiary-fixed-variant": "#783200",
                    "on-primary-container": "#004b1e",
                    "inverse-primary": "#4ae176",
                    "on-secondary-container": "#586377",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#111c2d",
                    "tertiary-container": "#ff8e4d",
                    "secondary-fixed-dim": "#bcc7de",
                    "secondary": "#545f73",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#191c1e",
                    "inverse-surface": "#2d3133",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "on-tertiary-container": "#6d2d00",
                    "secondary-container": "#d5e0f8",
                    "on-primary-fixed": "#002109",
                    "surface-container-high": "#e6e8ea",
                    "surface-tint": "#006e2f",
                    "error-container": "#ffdad6",
                    "on-background": "#191c1e",
                    "primary-fixed-dim": "#4ae176",
                    "secondary-fixed": "#d8e3fb",
                    "tertiary-fixed-dim": "#ffb690",
                    "inverse-on-surface": "#eff1f3",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "24px",
                    "gutter": "16px",
                    "container-padding": "20px",
                    "base": "8px",
                    "stack-sm": "12px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .soft-card-shadow {
            box-shadow: 0px 4px 12px rgba(30, 41, 59, 0.05);
        }
        .active-interaction:active {
            transform: scale(0.98);
            transition: transform 0.15s ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e0e3e5;
            border-radius: 10px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background">
<!-- Top Navigation (Shell suppressed for Task Focus) -->
<header class="w-full top-0 sticky z-40 flex justify-between items-center px-container-padding h-16 bg-background">
<button class="p-2 active-interaction" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<span class="text-headline-md font-headline-md text-primary tracking-tight">Escaneado</span>
<button class="p-2 active-interaction">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</header>
<main class="max-w-md mx-auto pb-32">
<!-- Product Image Section -->
<div class="relative w-full aspect-square overflow-hidden bg-surface-container-low px-container-padding pt-4">
<div class="w-full h-full rounded-2xl overflow-hidden soft-card-shadow border border-outline-variant/30">
<img class="w-full h-full object-cover" data-alt="A premium high-resolution studio photograph of a minimalist organic oatmeal cereal box. The packaging features clean typography and soft earth tones, set against a bright, modern light-mode background with soft diffused lighting. The aesthetic is fresh, organized, and reliable, mirroring a high-end food resource management application. Gentle shadows ground the product, emphasizing its quality and simplicity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMvcg4q5LpH3Q62jloVHu8s-bukc-OAcVoH5AgJ_dHu55N1pwFAjTkjhEqZmIKxo9IJDEdFRVEyZk1K_aARGbnXaArdTpS-sbYy0XaPArYnTszbliQBwhcyy4V8ug-rf0BVaXJ4oXRAIKWenbZ2eP_SVYZ2n_9MOPVMz3xwofDCQAOUayHmfmnR7NIUVVMZ4W7lOqZ7npvoFqvWrEvgAcAw4602OrOcql2D5D8Dif7XiNslwGd7kVI429N_SQK2Z2Mac-XDOGNwQM"/>
</div>
<!-- Success Badge -->
<div class="absolute top-8 right-10 bg-primary-container text-on-primary-container px-4 py-1.5 rounded-full flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-md font-label-md">Reconocido</span>
</div>
</div>
<!-- Product Content -->
<section class="px-container-padding mt-stack-md">
<div class="flex flex-col gap-1">
<span class="text-label-md font-label-md text-primary uppercase tracking-widest">Cereales y Granos</span>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Cereal de Avena Organico</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant">350g • Fuente natural de fibra</p>
</div>
<!-- Configuration Grid -->
<div class="mt-stack-md flex flex-col gap-stack-sm">
<!-- Quantity & Location Row -->
<div class="grid grid-cols-2 gap-stack-sm">
<!-- Quantity Selector -->
<div class="bg-surface-container-lowest p-4 rounded-xl soft-card-shadow border border-outline-variant/20">
<label class="text-label-md font-label-md text-on-surface-variant block mb-3">Cantidad</label>
<div class="flex items-center justify-between">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center active-interaction" onclick="updateQty(-1)">
<span class="material-symbols-outlined text-on-surface">remove</span>
</button>
<span class="text-headline-md font-headline-md" id="qty-value">1</span>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center active-interaction" onclick="updateQty(1)">
<span class="material-symbols-outlined text-on-surface">add</span>
</button>
</div>
</div>
<!-- Category Picker -->
<div class="bg-surface-container-lowest p-4 rounded-xl soft-card-shadow border border-outline-variant/20">
<label class="text-label-md font-label-md text-on-surface-variant block mb-3">Ubicación</label>
<div class="flex items-center justify-between text-on-surface active-interaction cursor-pointer" onclick="document.getElementById('category-select').click()">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">kitchen</span>
<span class="text-body-lg font-body-lg" id="location-text">Despensa</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">expand_more</span>
<select class="hidden" id="category-select" onchange="document.getElementById('location-text').innerText = this.value">
<option value="Despensa">Despensa</option>
<option value="Nevera">Nevera</option>
<option value="Congelador">Congelador</option>
</select>
</div>
</div>
</div>
<!-- Expiration Date Field -->
<div class="bg-surface-container-lowest p-4 rounded-xl soft-card-shadow border border-outline-variant/20">
<label class="text-label-md font-label-md text-on-surface-variant block mb-2">Fecha de Vencimiento</label>
<div class="flex items-center gap-3 bg-surface p-3 rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-tertiary">calendar_today</span>
<input class="bg-transparent border-none w-full text-body-lg font-body-lg text-on-surface focus:ring-0 p-0" type="date" value="2024-12-31"/>
</div>
<div class="mt-2 flex items-center gap-2 px-1">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<span class="text-body-sm font-body-sm text-on-surface-variant">Larga duración detectada</span>
</div>
</div>
<!-- Section Selector (Tabs for Categories) -->
<div class="mt-4">
<label class="text-label-md font-label-md text-on-surface-variant block mb-3">Categoría de Inventario</label>
<div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
<button class="px-6 py-2 rounded-full bg-primary-container text-on-primary-container text-label-md font-label-md border border-primary/20 whitespace-nowrap active-interaction">Pantry</button>
<button class="px-6 py-2 rounded-full bg-surface-container text-on-surface-variant text-label-md font-label-md whitespace-nowrap active-interaction">Fridge</button>
<button class="px-6 py-2 rounded-full bg-surface-container text-on-surface-variant text-label-md font-label-md whitespace-nowrap active-interaction">Freezer</button>
<button class="px-6 py-2 rounded-full bg-surface-container text-on-surface-variant text-label-md font-label-md whitespace-nowrap active-interaction">Counter</button>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Action Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-lowest p-container-padding flex flex-col gap-3 shadow-[0px_-4px_12px_rgba(30,41,59,0.05)] z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-full flex items-center justify-center gap-2 font-semibold active-interaction shadow-md">
<span class="material-symbols-outlined">add_shopping_cart</span>
            Añadir a mi despensa
        </button>
<button class="w-full h-14 bg-surface-container text-on-surface-variant rounded-full flex items-center justify-center gap-2 font-semibold active-interaction">
<span class="material-symbols-outlined">edit</span>
            Editar información
        </button>
<!-- Home Indicator Area Spacer -->
<div class="h-4"></div>
</footer>
<script>
        // Quantity Logic
        let currentQty = 1;
        function updateQty(delta) {
            currentQty = Math.max(1, currentQty + delta);
            document.getElementById('qty-value').innerText = currentQty;
        }

        // Simple Tab Interaction
        const categoryButtons = document.querySelectorAll('.overflow-x-auto button');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary/20');
                    b.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
                btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary/20');
            });
        });

        // Add to Pantry Success Micro-interaction
        document.querySelector('.bg-primary').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-bounce">check</span> ¡Guardado!';
            this.classList.remove('bg-primary');
            this.classList.add('bg-primary-container', 'text-on-primary-container');
            
            setTimeout(() => {
                // Reset state after 2 seconds
                this.innerHTML = '<span class="material-symbols-outlined">add_shopping_cart</span> Añadir a mi despensa';
                this.classList.add('bg-primary');
                this.classList.remove('bg-primary-container', 'text-on-primary-container');
            }, 2000);
        });
    </script>
</body></html>
